    <!-- KONFIGURASI white-label (edit /config.js, tanpa build). Dimuat SEBELUM
         bundle agar window.__AF_CONFIG sudah siap saat app jalan. -->
    <script src="/config.js?v=gemini-20261011"></script>
    <script>
      // Set judul tab + warna brand untuk dark dan light mode.
      // Dijalankan sebelum bundle agar warna tampil tanpa flash.
      (function () {
        try {
          var cfg = window.__AF_CONFIG || {};
          if (cfg.brandName) document.title = cfg.brandName + ' — Instant Design Studio';

          var hexToRgb = function (hex) {
            var h = String(hex).replace('#', '').trim();
            if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
            if (!/^[0-9a-fA-F]{6}$/.test(h)) return null;
            return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
          };
          var clamp = function (n) { return Math.max(0, Math.min(255, Math.round(n))); };
          var rgbStr = function (a) { return a[0] + ', ' + a[1] + ', ' + a[2]; };
          var lighten = function (a, p) { return [clamp(a[0] + (255 - a[0]) * p), clamp(a[1] + (255 - a[1]) * p), clamp(a[2] + (255 - a[2]) * p)]; };
          var darken = function (a, p) { return [clamp(a[0] * (1 - p)), clamp(a[1] * (1 - p)), clamp(a[2] * (1 - p))]; };
          var toRgb = function (a) { return 'rgb(' + a[0] + ',' + a[1] + ',' + a[2] + ')'; };

          var rules = [];
          var addThemeRules = function (selector, accentHex, bgHex, isLight) {
            var declarations = [];
            var ac = hexToRgb(accentHex);
            if (ac) {
              declarations.push('--accent:' + toRgb(ac) + ';');
              declarations.push('--accent-rgb:' + rgbStr(ac) + ';');
              declarations.push('--accent-hover:' + toRgb(isLight ? darken(ac, 0.12) : lighten(ac, 0.12)) + ';');
              declarations.push('--accent-deep:' + toRgb(darken(ac, 0.30)) + ';');
              declarations.push('--accent-soft:rgba(' + rgbStr(ac) + ',0.20);');
              declarations.push('--border:rgba(' + rgbStr(ac) + ',0.18);');
              declarations.push('--border-strong:rgba(' + rgbStr(ac) + ',0.38);');
            }
            var bg = hexToRgb(bgHex);
            if (bg) {
              declarations.push('--bg:' + toRgb(bg) + ';');
              declarations.push('--bg-deep:' + toRgb(darken(bg, isLight ? 0.04 : 0.4)) + ';');
              declarations.push('--bg-panel:' + toRgb(lighten(bg, isLight ? 0.40 : 0.06)) + ';');
              declarations.push('--bg-elev:' + toRgb(isLight ? darken(bg, 0.015) : lighten(bg, 0.12)) + ';');
            }
            if (declarations.length) rules.push(selector + '{' + declarations.join('') + '}');
          };
          addThemeRules(':root:not(.theme-light)', cfg.accentColor, cfg.bgColor, false);
          addThemeRules(':root.theme-light', cfg.accentColorLight, cfg.bgColorLight, true);
          if (rules.length) {
            var st = document.createElement('style');
            st.textContent = rules.join('');
            document.head.appendChild(st);
          }
        } catch (e) {}
      })();
    </script>

    <!-- Watchdog anti-blank (non-module → jalan bahkan di browser lama):
         1) Setelah 2.5s paksa konten .reveal terlihat — beberapa HP (battery
            saver / "remove animations") mem-pause animasi CSS sehingga konten
            stuck transparan → halaman tampak cuma warna.
         2) Kalau React belum mount setelah 12s (bundle gagal load / gagal parse
            di browser lama), ganti splash jadi tombol Muat Ulang — bukan
            "Loading..." selamanya. -->
    <script>
      (function () {
        setTimeout(function () {
          document.documentElement.className += ' anims-settled';
        }, 1200);
        setTimeout(function () {
          if (!window.__AF_MOUNTED) {
            var el = document.getElementById('initial-loader');
            if (el) {
              el.innerHTML =
                '<div style="text-align:center;font-family:Inter,system-ui,sans-serif;color:#fff;padding:0 24px">' +
                '<div style="font-size:15px;font-weight:700;margin-bottom:6px">Koneksi lambat atau gagal memuat</div>' +
                '<div style="font-size:12px;color:rgba(255,255,255,.6);margin-bottom:16px">Periksa koneksi internetmu, lalu coba lagi.</div>' +
                '<button onclick="location.reload()" style="background:linear-gradient(135deg,#315fdf,#163da5);color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:14px;font-weight:700;cursor:pointer">&#8635; Muat Ulang</button>' +
                '</div>';
            }
          }
        }, 12000);
      })();
    </script>
